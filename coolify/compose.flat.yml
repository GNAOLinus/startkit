configs:
  meet-settings-http:
    content: "\"\"\"Meet en HTTP simple pour la stack locale : Production sans HTTPS.\"\"\"\n\nfrom meet.settings import Production\n\n\nclass Http(Production):\n    \"\"\"Production settings served over\
      \ plain HTTP (local stack only).\"\"\"\n\n    SECURE_SSL_REDIRECT = False\n    SECURE_PROXY_SSL_HEADER = None\n    SECURE_HSTS_SECONDS = 0\n    SECURE_HSTS_PRELOAD = False\n    SECURE_HSTS_INCLUDE_SUBDOMAINS\
      \ = False\n    SESSION_COOKIE_SECURE = False\n    CSRF_COOKIE_SECURE = False\n"
  meet-egress-config:
    content: "logging:\n  level: info\napi_key: meet\napi_secret: meet-livekit-secret-bd33da5fe0a97f44111376a1d46b91a9\nws_url: ws://127.0.0.1:7880\ninsecure: true\nredis:\n  address: redis:6379\n  db:\
      \ 3\n"
  messages-settings-http:
    content: "\"\"\"La Suite en local : configuration Production servie en HTTP simple.\"\"\"\n\nfrom messages.settings import Production\n\n\nclass Http(Production):\n    \"\"\"Production sans HTTPS (pas\
      \ de redirection, de HSTS ni de cookies Secure).\"\"\"\n\n    SECURE_SSL_REDIRECT = False\n    SECURE_PROXY_SSL_HEADER = None\n    SECURE_HSTS_SECONDS = 0\n    SECURE_HSTS_PRELOAD = False\n    SECURE_HSTS_INCLUDE_SUBDOMAINS\
      \ = False\n    SESSION_COOKIE_SECURE = False\n    CSRF_COOKIE_SECURE = False\n    SESSION_COOKIE_NAME = \"messages_sessionid\"\n"
  messages-bootstrap:
    content: "from core.models import Mailbox, MailDomain\n\ndomain, _ = MailDomain.objects.get_or_create(name=\"startkit.localhost\")\nif not domain.oidc_autojoin:\n    domain.oidc_autojoin = True\n  \
      \  domain.save()\nfor local_part in (\"user1\", \"user2\", \"user3\"):\n    Mailbox.objects.get_or_create(local_part=local_part, domain=domain)\nprint(\"Domaine startkit.localhost (oidc_autojoin)\
      \ et boîtes user1..3 prêts.\")\n"
  docs-settings-http:
    content: "\"\"\"Docs en HTTP simple pour la stack locale : Production sans HTTPS.\"\"\"\n\nfrom impress.settings import Production\n\n\nclass Http(Production):\n    \"\"\"Production settings served\
      \ over plain HTTP (local stack only).\"\"\"\n\n    SECURE_SSL_REDIRECT = False\n    SECURE_PROXY_SSL_HEADER = None\n    SECURE_HSTS_SECONDS = 0\n    SECURE_HSTS_PRELOAD = False\n    SECURE_HSTS_INCLUDE_SUBDOMAINS\
      \ = False\n    SESSION_COOKIE_SECURE = False\n    CSRF_COOKIE_SECURE = False\n    # Appels au y-provider en http://docs-y-provider:4444\n    CONVERSION_API_SECURE = False\n"
  drive-settings-http:
    content: "\"\"\"Drive en HTTP simple pour la stack locale : Production sans HTTPS.\"\"\"\n\nfrom drive.settings import Production\n\n\nclass Http(Production):\n    \"\"\"Production settings served over\
      \ plain HTTP (local stack only).\"\"\"\n\n    SECURE_SSL_REDIRECT = False\n    SECURE_PROXY_SSL_HEADER = None\n    SECURE_HSTS_SECONDS = 0\n    SECURE_HSTS_PRELOAD = False\n    SECURE_HSTS_INCLUDE_SUBDOMAINS\
      \ = False\n    SESSION_COOKIE_SECURE = False\n    CSRF_COOKIE_SECURE = False\n"
  transfers-settings-http:
    content: "\"\"\"La Suite en local : configuration Production servie en HTTP simple.\"\"\"\n\nfrom transfers.settings import Production\n\n\nclass Http(Production):\n    \"\"\"Production sans HTTPS (pas\
      \ de redirection, de HSTS ni de cookies Secure).\"\"\"\n\n    SECURE_SSL_REDIRECT = False\n    SECURE_PROXY_SSL_HEADER = None\n    SECURE_HSTS_SECONDS = 0\n    SECURE_HSTS_PRELOAD = False\n    SECURE_HSTS_INCLUDE_SUBDOMAINS\
      \ = False\n    SESSION_COOKIE_SECURE = False\n    CSRF_COOKIE_SECURE = False\n    SESSION_COOKIE_NAME = \"transfers_sessionid\"\n    # Le frontend lit le cookie « csrftoken » : ne pas renommer CSRF_COOKIE_NAME.\n\
      \    # Schéma OpenAPI pour tester l'API à la main :\n    # /api/v1.0/swagger.json, /api/v1.0/swagger/ (UI chargée depuis un CDN).\n    USE_SWAGGER = True\n"
  conversations-settings-http:
    content: "\"\"\"Conversations en HTTP simple pour la stack locale : Production sans HTTPS.\"\"\"\n\nfrom conversations.settings import Production\n\n\nclass Http(Production):\n    \"\"\"Production settings\
      \ served over plain HTTP (local stack only).\"\"\"\n\n    SECURE_SSL_REDIRECT = False\n    SECURE_PROXY_SSL_HEADER = None\n    SECURE_HSTS_SECONDS = 0\n    SECURE_HSTS_PRELOAD = False\n    SECURE_HSTS_INCLUDE_SUBDOMAINS\
      \ = False\n    SESSION_COOKIE_SECURE = False\n    CSRF_COOKIE_SECURE = False\n    SESSION_COOKIE_NAME = \"conversations_sessionid\"\n"
