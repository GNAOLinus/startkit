# ATTENTION : fichier généré par `python3 coolify/flatten.py`, ne pas éditer.
#
# Source : coolify/compose.yml (+ les fichiers qu'il inclut).
# Cible  : ressource Coolify « Docker Compose »
#            Base Directory ............ /
#            Docker Compose Location ... /coolify/compose.flat.yml
#
# Coolify ne résout pas `include:` et remplace les `env_file:` des services par
# un `.env` commun : ce fichier est donc aplati et les `env_file:` y sont
# convertis en `environment:` référençant les variables Coolify prefixées
# (${MEET_DB_NAME?}, …). Le bloc de valeurs à coller dans Coolify est produit
# par `bash coolify/prepare.sh` : coolify/generated/variables-coolify.env.

name: startkit
services:
  proxy:
    image: caddy:2.10-alpine
    ports:
    - 8000:8000
    volumes:
    - ./stack/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    - ./stack/caddy/apps:/etc/caddy/apps:ro
    - ./stack/portal:/srv/portal:ro
    networks:
      default:
        aliases:
        - startkit.localhost
        - auth.localhost
        - mail.localhost
        - s3.localhost
        - s3-console.localhost
        - docs.localhost
        - visio.localhost
        - livekit.localhost
        - messages.localhost
        - projects.localhost
        - fichiers.localhost
        - grist.localhost
        - transfers.localhost
        - assistant.localhost
    restart: unless-stopped
    environment:
      DOMAIN: ${PROXY_DOMAIN?}
  postgres:
    image: postgres:16-alpine
    volumes:
    - ./coolify/generated/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${INFRA_POSTGRES_PASSWORD?}
  redis:
    image: redis:7-alpine
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  s3:
    image: pgsty/silo
    command: server --console-address :9001 /data
    volumes:
    - s3-data:/data
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 2s
      timeout: 20s
      retries: 60
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_MINIO_ROOT_USER?}
      MINIO_ROOT_PASSWORD: ${S3_MINIO_ROOT_PASSWORD?}
  s3-init:
    image: pgsty/mc
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: 'sh -c " mc alias set local http://s3:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing local/docs-media-storage && mc version enable local/docs-media-storage
      && mc mb --ignore-existing local/docs-yhub-storage && mc version enable local/docs-yhub-storage && mc mb --ignore-existing local/meet-recordings && mc mb --ignore-existing local/messages-storage &&
      mc mb --ignore-existing local/projects-storage && mc mb --ignore-existing local/drive-media-storage && mc version enable local/drive-media-storage && mc mb --ignore-existing local/grist-docs && mc
      version enable local/grist-docs && mc mb --ignore-existing local/transfers-storage && mc mb --ignore-existing local/conversations-storage && exit 0;"

      '
    environment:
      MINIO_ROOT_USER: ${S3_MINIO_ROOT_USER?}
      MINIO_ROOT_PASSWORD: ${S3_MINIO_ROOT_PASSWORD?}
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command:
    - start
    - --import-realm
    - --health-enabled=true
    environment:
      KC_DB_PASSWORD: ${KEYCLOAK_KC_DB_PASSWORD?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_KC_BOOTSTRAP_ADMIN_USERNAME?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_KC_BOOTSTRAP_ADMIN_PASSWORD?}
      KC_HOSTNAME: ${KEYCLOAK_KC_HOSTNAME?}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      JAVA_OPTS_APPEND: -Xms256m -Xmx768m
    volumes:
    - ./coolify/generated/startkit-realm.json:/opt/keycloak/data/import/startkit-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf ''GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3 && grep -q UP <&3'
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
  projects-app:
    image: lasuite/projects:1.27.13
    volumes:
    - projects-user-avatars:/app/public/user-avatars
    - projects-background-images:/app/public/project-background-images
    - projects-attachments:/app/private/attachments
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mail:
        condition: service_started
    restart: unless-stopped
    environment:
      BASE_URL: ${PROJECTS_BASE_URL?}
      DATABASE_URL: ${PROJECTS_DATABASE_URL?}
      SECRET_KEY: ${PROJECTS_SECRET_KEY?}
      TRUST_PROXY: ${PROJECTS_TRUST_PROXY?}
      TZ: ${PROJECTS_TZ?}
      OIDC_ISSUER: ${PROJECTS_OIDC_ISSUER?}
      OIDC_CLIENT_ID: ${PROJECTS_OIDC_CLIENT_ID?}
      OIDC_CLIENT_SECRET: ${PROJECTS_OIDC_CLIENT_SECRET?}
      OIDC_ENFORCED: ${PROJECTS_OIDC_ENFORCED?}
      OIDC_SCOPES: ${PROJECTS_OIDC_SCOPES?}
      OIDC_USE_DEFAULT_RESPONSE_MODE: ${PROJECTS_OIDC_USE_DEFAULT_RESPONSE_MODE?}
      OIDC_CLAIMS_SOURCE: ${PROJECTS_OIDC_CLAIMS_SOURCE?}
      OIDC_EMAIL_ATTRIBUTE: ${PROJECTS_OIDC_EMAIL_ATTRIBUTE?}
      OIDC_FULLNAME_ATTRIBUTES: ${PROJECTS_OIDC_FULLNAME_ATTRIBUTES?}
      OIDC_IGNORE_USERNAME: ${PROJECTS_OIDC_IGNORE_USERNAME?}
      OIDC_IGNORE_ROLES: ${PROJECTS_OIDC_IGNORE_ROLES?}
      ALLOW_ALL_TO_CREATE_PROJECTS: ${PROJECTS_ALLOW_ALL_TO_CREATE_PROJECTS?}
      DEFAULT_LANGUAGE: ${PROJECTS_DEFAULT_LANGUAGE?}
      DISABLE_INDEXING: ${PROJECTS_DISABLE_INDEXING?}
      DEFAULT_ADMIN_EMAIL: ${PROJECTS_DEFAULT_ADMIN_EMAIL?}
      DEFAULT_ADMIN_NAME: ${PROJECTS_DEFAULT_ADMIN_NAME?}
      SMTP_HOST: ${PROJECTS_SMTP_HOST?}
      SMTP_PORT: ${PROJECTS_SMTP_PORT?}
      SMTP_SECURE: ${PROJECTS_SMTP_SECURE?}
      SMTP_FROM: ${PROJECTS_SMTP_FROM?}
  meet-migrate:
    image: lasuite/meet-backend:v1.37.0
    configs:
    - source: meet-settings-http
      target: /app/meet/settings_http.py
    command:
    - sh
    - -c
    - 'python manage.py migrate --noinput && python manage.py createsuperuser --email admin@startkit.localhost --password admin

      '
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'
    environment:
      DJANGO_SETTINGS_MODULE: ${MEET_DJANGO_SETTINGS_MODULE?}
      DJANGO_CONFIGURATION: ${MEET_DJANGO_CONFIGURATION?}
      DJANGO_SECRET_KEY: ${MEET_DJANGO_SECRET_KEY?}
      DJANGO_ALLOWED_HOSTS: ${MEET_DJANGO_ALLOWED_HOSTS?}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${MEET_DJANGO_CSRF_TRUSTED_ORIGINS?}
      DJANGO_CORS_ALLOWED_ORIGINS: ${MEET_DJANGO_CORS_ALLOWED_ORIGINS?}
      DJANGO_SILENCED_SYSTEM_CHECKS: ${MEET_DJANGO_SILENCED_SYSTEM_CHECKS?}
      PYTHONPATH: ${MEET_PYTHONPATH?}
      DB_HOST: ${MEET_DB_HOST?}
      DB_PORT: ${MEET_DB_PORT?}
      DB_NAME: ${MEET_DB_NAME?}
      DB_USER: ${MEET_DB_USER?}
      DB_PASSWORD: ${MEET_DB_PASSWORD?}
      REDIS_URL: ${MEET_REDIS_URL?}
      CELERY_BROKER_URL: ${MEET_CELERY_BROKER_URL?}
      CELERY_ENABLED: ${MEET_CELERY_ENABLED?}
      STORAGES_STATICFILES_BACKEND: ${MEET_STORAGES_STATICFILES_BACKEND?}
      AWS_S3_ENDPOINT_URL: ${MEET_AWS_S3_ENDPOINT_URL?}
      AWS_S3_ACCESS_KEY_ID: ${MEET_AWS_S3_ACCESS_KEY_ID?}
      AWS_S3_SECRET_ACCESS_KEY: ${MEET_AWS_S3_SECRET_ACCESS_KEY?}
      AWS_S3_REGION_NAME: ${MEET_AWS_S3_REGION_NAME?}
      AWS_STORAGE_BUCKET_NAME: ${MEET_AWS_STORAGE_BUCKET_NAME?}
      FILE_UPLOAD_ENABLED: ${MEET_FILE_UPLOAD_ENABLED?}
      APPLICATION_BASE_URL: ${MEET_APPLICATION_BASE_URL?}
      DJANGO_EMAIL_HOST: ${MEET_DJANGO_EMAIL_HOST?}
      DJANGO_EMAIL_PORT: ${MEET_DJANGO_EMAIL_PORT?}
      DJANGO_EMAIL_USE_TLS: ${MEET_DJANGO_EMAIL_USE_TLS?}
      DJANGO_EMAIL_USE_SSL: ${MEET_DJANGO_EMAIL_USE_SSL?}
      DJANGO_EMAIL_FROM: ${MEET_DJANGO_EMAIL_FROM?}
      DJANGO_EMAIL_BRAND_NAME: ${MEET_DJANGO_EMAIL_BRAND_NAME?}
      DJANGO_EMAIL_SUPPORT_EMAIL: ${MEET_DJANGO_EMAIL_SUPPORT_EMAIL?}
      DJANGO_EMAIL_LOGO_IMG: ${MEET_DJANGO_EMAIL_LOGO_IMG?}
      DJANGO_EMAIL_DOMAIN: ${MEET_DJANGO_EMAIL_DOMAIN?}
      DJANGO_EMAIL_APP_BASE_URL: ${MEET_DJANGO_EMAIL_APP_BASE_URL?}
      OIDC_OP_JWKS_ENDPOINT: ${MEET_OIDC_OP_JWKS_ENDPOINT?}
      OIDC_OP_AUTHORIZATION_ENDPOINT: ${MEET_OIDC_OP_AUTHORIZATION_ENDPOINT?}
      OIDC_OP_TOKEN_ENDPOINT: ${MEET_OIDC_OP_TOKEN_ENDPOINT?}
      OIDC_OP_USER_ENDPOINT: ${MEET_OIDC_OP_USER_ENDPOINT?}
      OIDC_OP_LOGOUT_ENDPOINT: ${MEET_OIDC_OP_LOGOUT_ENDPOINT?}
      OIDC_OP_URL: ${MEET_OIDC_OP_URL?}
      OIDC_RP_CLIENT_ID: ${MEET_OIDC_RP_CLIENT_ID?}
      OIDC_RP_CLIENT_SECRET: ${MEET_OIDC_RP_CLIENT_SECRET?}
      OIDC_RP_SIGN_ALGO: ${MEET_OIDC_RP_SIGN_ALGO?}
      OIDC_RP_SCOPES: ${MEET_OIDC_RP_SCOPES?}
      OIDC_USERINFO_FULLNAME_FIELDS: ${MEET_OIDC_USERINFO_FULLNAME_FIELDS?}
      OIDC_USERINFO_SHORTNAME_FIELD: ${MEET_OIDC_USERINFO_SHORTNAME_FIELD?}
      OIDC_REDIRECT_ALLOWED_HOSTS: ${MEET_OIDC_REDIRECT_ALLOWED_HOSTS?}
      OIDC_REDIRECT_REQUIRE_HTTPS: ${MEET_OIDC_REDIRECT_REQUIRE_HTTPS?}
      LOGIN_REDIRECT_URL: ${MEET_LOGIN_REDIRECT_URL?}
      LOGIN_REDIRECT_URL_FAILURE: ${MEET_LOGIN_REDIRECT_URL_FAILURE?}
      LOGOUT_REDIRECT_URL: ${MEET_LOGOUT_REDIRECT_URL?}
      LIVEKIT_API_KEY: ${MEET_LIVEKIT_API_KEY?}
      LIVEKIT_API_SECRET: ${MEET_LIVEKIT_API_SECRET?}
      LIVEKIT_API_URL: ${MEET_LIVEKIT_API_URL?}
      LIVEKIT_VERIFY_SSL: ${MEET_LIVEKIT_VERIFY_SSL?}
      LIVEKIT_FORCE_WSS_PROTOCOL: ${MEET_LIVEKIT_FORCE_WSS_PROTOCOL?}
      ALLOW_UNREGISTERED_ROOMS: ${MEET_ALLOW_UNREGISTERED_ROOMS?}
      RECORDING_ENABLE: ${MEET_RECORDING_ENABLE?}
      RECORDING_DOWNLOAD_BASE_URL: ${MEET_RECORDING_DOWNLOAD_BASE_URL?}
      ROOM_SUBTITLE_ENABLED: ${MEET_ROOM_SUBTITLE_ENABLED?}
      METADATA_COLLECTOR_ENABLED: ${MEET_METADATA_COLLECTOR_ENABLED?}
      ROOM_TELEPHONY_ENABLED: ${MEET_ROOM_TELEPHONY_ENABLED?}
      EXTERNAL_API_ENABLED: ${MEET_EXTERNAL_API_ENABLED?}
      ADDONS_ENABLED: ${MEET_ADDONS_ENABLED?}
      CONNECTION_TEST_ENABLED: ${MEET_CONNECTION_TEST_ENABLED?}
      FRONTEND_USE_FRENCH_GOV_FOOTER: ${MEET_FRONTEND_USE_FRENCH_GOV_FOOTER?}
      FRONTEND_USE_PROCONNECT_BUTTON: ${MEET_FRONTEND_USE_PROCONNECT_BUTTON?}
      FRONTEND_SILENCE_LIVEKIT_DEBUG: ${MEET_FRONTEND_SILENCE_LIVEKIT_DEBUG?}
  meet-backend:
    image: lasuite/meet-backend:v1.37.0
    configs:
    - source: meet-settings-http
      target: /app/meet/settings_http.py
    command:
    - gunicorn
    - -c
    - /usr/local/etc/gunicorn/meet.py
    - --workers=2
    - meet.wsgi:application
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/__lbheartbeat__', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      meet-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meet-livekit:
        condition: service_started
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: ${MEET_DJANGO_SETTINGS_MODULE?}
      DJANGO_CONFIGURATION: ${MEET_DJANGO_CONFIGURATION?}
      DJANGO_SECRET_KEY: ${MEET_DJANGO_SECRET_KEY?}
      DJANGO_ALLOWED_HOSTS: ${MEET_DJANGO_ALLOWED_HOSTS?}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${MEET_DJANGO_CSRF_TRUSTED_ORIGINS?}
      DJANGO_CORS_ALLOWED_ORIGINS: ${MEET_DJANGO_CORS_ALLOWED_ORIGINS?}
      DJANGO_SILENCED_SYSTEM_CHECKS: ${MEET_DJANGO_SILENCED_SYSTEM_CHECKS?}
      PYTHONPATH: ${MEET_PYTHONPATH?}
      DB_HOST: ${MEET_DB_HOST?}
      DB_PORT: ${MEET_DB_PORT?}
      DB_NAME: ${MEET_DB_NAME?}
      DB_USER: ${MEET_DB_USER?}
      DB_PASSWORD: ${MEET_DB_PASSWORD?}
      REDIS_URL: ${MEET_REDIS_URL?}
      CELERY_BROKER_URL: ${MEET_CELERY_BROKER_URL?}
      CELERY_ENABLED: ${MEET_CELERY_ENABLED?}
      STORAGES_STATICFILES_BACKEND: ${MEET_STORAGES_STATICFILES_BACKEND?}
      AWS_S3_ENDPOINT_URL: ${MEET_AWS_S3_ENDPOINT_URL?}
      AWS_S3_ACCESS_KEY_ID: ${MEET_AWS_S3_ACCESS_KEY_ID?}
      AWS_S3_SECRET_ACCESS_KEY: ${MEET_AWS_S3_SECRET_ACCESS_KEY?}
      AWS_S3_REGION_NAME: ${MEET_AWS_S3_REGION_NAME?}
      AWS_STORAGE_BUCKET_NAME: ${MEET_AWS_STORAGE_BUCKET_NAME?}
      FILE_UPLOAD_ENABLED: ${MEET_FILE_UPLOAD_ENABLED?}
      APPLICATION_BASE_URL: ${MEET_APPLICATION_BASE_URL?}
      DJANGO_EMAIL_HOST: ${MEET_DJANGO_EMAIL_HOST?}
      DJANGO_EMAIL_PORT: ${MEET_DJANGO_EMAIL_PORT?}
      DJANGO_EMAIL_USE_TLS: ${MEET_DJANGO_EMAIL_USE_TLS?}
      DJANGO_EMAIL_USE_SSL: ${MEET_DJANGO_EMAIL_USE_SSL?}
      DJANGO_EMAIL_FROM: ${MEET_DJANGO_EMAIL_FROM?}
      DJANGO_EMAIL_BRAND_NAME: ${MEET_DJANGO_EMAIL_BRAND_NAME?}
      DJANGO_EMAIL_SUPPORT_EMAIL: ${MEET_DJANGO_EMAIL_SUPPORT_EMAIL?}
      DJANGO_EMAIL_LOGO_IMG: ${MEET_DJANGO_EMAIL_LOGO_IMG?}
      DJANGO_EMAIL_DOMAIN: ${MEET_DJANGO_EMAIL_DOMAIN?}
      DJANGO_EMAIL_APP_BASE_URL: ${MEET_DJANGO_EMAIL_APP_BASE_URL?}
      OIDC_OP_JWKS_ENDPOINT: ${MEET_OIDC_OP_JWKS_ENDPOINT?}
      OIDC_OP_AUTHORIZATION_ENDPOINT: ${MEET_OIDC_OP_AUTHORIZATION_ENDPOINT?}
      OIDC_OP_TOKEN_ENDPOINT: ${MEET_OIDC_OP_TOKEN_ENDPOINT?}
      OIDC_OP_USER_ENDPOINT: ${MEET_OIDC_OP_USER_ENDPOINT?}
      OIDC_OP_LOGOUT_ENDPOINT: ${MEET_OIDC_OP_LOGOUT_ENDPOINT?}
      OIDC_OP_URL: ${MEET_OIDC_OP_URL?}
      OIDC_RP_CLIENT_ID: ${MEET_OIDC_RP_CLIENT_ID?}
      OIDC_RP_CLIENT_SECRET: ${MEET_OIDC_RP_CLIENT_SECRET?}
      OIDC_RP_SIGN_ALGO: ${MEET_OIDC_RP_SIGN_ALGO?}
      OIDC_RP_SCOPES: ${MEET_OIDC_RP_SCOPES?}
      OIDC_USERINFO_FULLNAME_FIELDS: ${MEET_OIDC_USERINFO_FULLNAME_FIELDS?}
      OIDC_USERINFO_SHORTNAME_FIELD: ${MEET_OIDC_USERINFO_SHORTNAME_FIELD?}
      OIDC_REDIRECT_ALLOWED_HOSTS: ${MEET_OIDC_REDIRECT_ALLOWED_HOSTS?}
      OIDC_REDIRECT_REQUIRE_HTTPS: ${MEET_OIDC_REDIRECT_REQUIRE_HTTPS?}
      LOGIN_REDIRECT_URL: ${MEET_LOGIN_REDIRECT_URL?}
      LOGIN_REDIRECT_URL_FAILURE: ${MEET_LOGIN_REDIRECT_URL_FAILURE?}
      LOGOUT_REDIRECT_URL: ${MEET_LOGOUT_REDIRECT_URL?}
      LIVEKIT_API_KEY: ${MEET_LIVEKIT_API_KEY?}
      LIVEKIT_API_SECRET: ${MEET_LIVEKIT_API_SECRET?}
      LIVEKIT_API_URL: ${MEET_LIVEKIT_API_URL?}
      LIVEKIT_VERIFY_SSL: ${MEET_LIVEKIT_VERIFY_SSL?}
      LIVEKIT_FORCE_WSS_PROTOCOL: ${MEET_LIVEKIT_FORCE_WSS_PROTOCOL?}
      ALLOW_UNREGISTERED_ROOMS: ${MEET_ALLOW_UNREGISTERED_ROOMS?}
      RECORDING_ENABLE: ${MEET_RECORDING_ENABLE?}
      RECORDING_DOWNLOAD_BASE_URL: ${MEET_RECORDING_DOWNLOAD_BASE_URL?}
      ROOM_SUBTITLE_ENABLED: ${MEET_ROOM_SUBTITLE_ENABLED?}
      METADATA_COLLECTOR_ENABLED: ${MEET_METADATA_COLLECTOR_ENABLED?}
      ROOM_TELEPHONY_ENABLED: ${MEET_ROOM_TELEPHONY_ENABLED?}
      EXTERNAL_API_ENABLED: ${MEET_EXTERNAL_API_ENABLED?}
      ADDONS_ENABLED: ${MEET_ADDONS_ENABLED?}
      CONNECTION_TEST_ENABLED: ${MEET_CONNECTION_TEST_ENABLED?}
      FRONTEND_USE_FRENCH_GOV_FOOTER: ${MEET_FRONTEND_USE_FRENCH_GOV_FOOTER?}
      FRONTEND_USE_PROCONNECT_BUTTON: ${MEET_FRONTEND_USE_PROCONNECT_BUTTON?}
      FRONTEND_SILENCE_LIVEKIT_DEBUG: ${MEET_FRONTEND_SILENCE_LIVEKIT_DEBUG?}
  meet-frontend:
    image: lasuite/meet-frontend:v1.37.0
    depends_on:
      meet-backend:
        condition: service_healthy
    restart: unless-stopped
  meet-livekit:
    image: livekit/livekit-server:v1.13.10
    command:
    - --config
    - /etc/livekit.yaml
    volumes:
    - ./coolify/generated/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
    - 7881:7881/tcp
    - 7882:7882/udp
  meet-egress:
    image: livekit/egress:v1.15.0
    profiles:
    - recording
    network_mode: service:meet-livekit
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    configs:
    - source: meet-egress-config
      target: /etc/egress.yaml
    cap_add:
    - SYS_ADMIN
    depends_on:
      meet-livekit:
        condition: service_started
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped
  messages-migrate:
    image: ghcr.io/suitenumerique/messages-backend:0.10.0
    configs:
    - source: messages-settings-http
      target: /app/messages/settings_http.py
    - source: messages-bootstrap
      target: /startkit/messages-bootstrap.py
    command:
    - sh
    - -c
    - 'python manage.py migrate --noinput && python manage.py create_bucket --storage message-imports --expire-days 7 && python manage.py create_bucket --storage message-blobs && python manage.py search_index_create
      && python manage.py createsuperuser --email admin@startkit.localhost --password admin && python manage.py shell < /startkit/messages-bootstrap.py

      '
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      messages-opensearch:
        condition: service_healthy
    restart: 'no'
    environment:
      DJANGO_SETTINGS_MODULE: ${MESSAGES_DJANGO_SETTINGS_MODULE?}
      DJANGO_CONFIGURATION: ${MESSAGES_DJANGO_CONFIGURATION?}
      DJANGO_SECRET_KEY: ${MESSAGES_DJANGO_SECRET_KEY?}
      DJANGO_ALLOWED_HOSTS: ${MESSAGES_DJANGO_ALLOWED_HOSTS?}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${MESSAGES_DJANGO_CSRF_TRUSTED_ORIGINS?}
      INSTANCE_URL: ${MESSAGES_INSTANCE_URL?}
      PYTHONPATH: ${MESSAGES_PYTHONPATH?}
      GUNICORN_CMD_ARGS: ${MESSAGES_GUNICORN_CMD_ARGS?}
      LOGGING_LEVEL_HANDLERS_CONSOLE: ${MESSAGES_LOGGING_LEVEL_HANDLERS_CONSOLE?}
      LOGGING_LEVEL_LOGGERS_ROOT: ${MESSAGES_LOGGING_LEVEL_LOGGERS_ROOT?}
      LOGGING_LEVEL_LOGGERS_APP: ${MESSAGES_LOGGING_LEVEL_LOGGERS_APP?}
      SALT_KEY: ${MESSAGES_SALT_KEY?}
      DB_HOST: ${MESSAGES_DB_HOST?}
      DB_PORT: ${MESSAGES_DB_PORT?}
      DB_NAME: ${MESSAGES_DB_NAME?}
      DB_USER: ${MESSAGES_DB_USER?}
      DB_PASSWORD: ${MESSAGES_DB_PASSWORD?}
      REDIS_URL: ${MESSAGES_REDIS_URL?}
      CELERY_BROKER_URL: ${MESSAGES_CELERY_BROKER_URL?}
      OIDC_OP_JWKS_ENDPOINT: ${MESSAGES_OIDC_OP_JWKS_ENDPOINT?}
      OIDC_OP_AUTHORIZATION_ENDPOINT: ${MESSAGES_OIDC_OP_AUTHORIZATION_ENDPOINT?}
      OIDC_OP_TOKEN_ENDPOINT: ${MESSAGES_OIDC_OP_TOKEN_ENDPOINT?}
      OIDC_OP_USER_ENDPOINT: ${MESSAGES_OIDC_OP_USER_ENDPOINT?}
