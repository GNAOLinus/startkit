# ATTENTION : fichier généré par `python3 coolify/flatten.py`, ne pas éditer.
#
# Source : coolify/compose.yml (+ les fichiers qu'il inclut).
# Cible  : ressource Coolify « Docker Compose »
#            Base Directory ............ /
#            Docker Compose Location ... /coolify/compose.flat.yml
#
# Coolify ne résout pas `include:` : ce fichier est aplati. Les configurations
# non secrètes viennent des gabarits suivis par Git ; Coolify génère les secrets
# via ses variables SERVICE_PASSWORD_*.

name: startkit
services:
  config-init:
    build:
      context: ./coolify
      dockerfile: Dockerfile.config-init
    environment:
      DOMAIN: ${DOMAIN:-web.niyiexpertise.com}
      CLIENT_SECRET_CONVERSATIONS: ${SERVICE_PASSWORD_64_CLIENTSECRETCONVERSATIONS}
      CLIENT_SECRET_DOCS: ${SERVICE_PASSWORD_64_CLIENTSECRETDOCS}
      CLIENT_SECRET_DRIVE: ${SERVICE_PASSWORD_64_CLIENTSECRETDRIVE}
      CLIENT_SECRET_GRIST: ${SERVICE_PASSWORD_64_CLIENTSECRETGRIST}
      CLIENT_SECRET_MEET: ${SERVICE_PASSWORD_64_CLIENTSECRETMEET}
      CLIENT_SECRET_MESSAGES: ${SERVICE_PASSWORD_64_CLIENTSECRETMESSAGES}
      CLIENT_SECRET_PROJECTS: ${SERVICE_PASSWORD_64_CLIENTSECRETPROJECTS}
      CLIENT_SECRET_TRANSFERS: ${SERVICE_PASSWORD_64_CLIENTSECRETTRANSFERS}
      DB_PASSWORD_CONVERSATIONS: ${SERVICE_PASSWORD_64_DBPASSWORDCONVERSATIONS}
      DB_PASSWORD_DOCS: ${SERVICE_PASSWORD_64_DBPASSWORDDOCS}
      DB_PASSWORD_DRIVE: ${SERVICE_PASSWORD_64_DBPASSWORDDRIVE}
      DB_PASSWORD_GRIST: ${SERVICE_PASSWORD_64_DBPASSWORDGRIST}
      DB_PASSWORD_KEYCLOAK: ${SERVICE_PASSWORD_64_DBPASSWORDKEYCLOAK}
      DB_PASSWORD_MEET: ${SERVICE_PASSWORD_64_DBPASSWORDMEET}
      DB_PASSWORD_MESSAGES: ${SERVICE_PASSWORD_64_DBPASSWORDMESSAGES}
      DB_PASSWORD_PROJECTS: ${SERVICE_PASSWORD_64_DBPASSWORDPROJECTS}
      DB_PASSWORD_TRANSFERS: ${SERVICE_PASSWORD_64_DBPASSWORDTRANSFERS}
      DB_PASSWORD_YHUB: ${SERVICE_PASSWORD_64_DBPASSWORDYHUB}
      DEMO_PASSWORD_USER1: ${SERVICE_PASSWORD_64_DEMOPASSWORDUSER1}
      DEMO_PASSWORD_USER2: ${SERVICE_PASSWORD_64_DEMOPASSWORDUSER2}
      DEMO_PASSWORD_USER3: ${SERVICE_PASSWORD_64_DEMOPASSWORDUSER3}
      KEYCLOAK_ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_KEYCLOAKADMINPASSWORD}
      LIVEKIT_API_KEY: ${SERVICE_USER_LIVEKIT}
      LIVEKIT_API_SECRET: ${SERVICE_PASSWORD_64_LIVEKITAPISECRET}
    volumes:
    - startkit-postgres-init:/postgres-init
    - startkit-keycloak-import:/keycloak-import
    - startkit-livekit-config:/livekit-config
    restart: 'no'
  proxy:
    build:
      context: ./stack
      dockerfile: caddy/Dockerfile.coolify
    ports:
    - 8000:8000
    environment:
      DOMAIN: ${DOMAIN:-web.niyiexpertise.com}
    networks:
      default:
        aliases:
        - startkit.localhost
        - auth.localhost
        - mail.localhost
        - s3.localhost
        - s3-console.localhost
        - docs.localhost
        - visio.localhost
        - livekit.localhost
        - messages.localhost
        - projects.localhost
        - fichiers.localhost
        - grist.localhost
        - transfers.localhost
        - assistant.localhost
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRESSUPERUSERPASSWORD}
    volumes:
    - startkit-postgres-init:/docker-entrypoint-initdb.d:ro
    - postgres-data:/var/lib/postgresql/data
    depends_on:
      config-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  s3:
    image: pgsty/silo
    environment:
      MINIO_ROOT_USER: startkit
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_S3SECRETKEY}
    command: server --console-address :9001 /data
    volumes:
    - s3-data:/data
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 2s
      timeout: 20s
      retries: 60
    restart: unless-stopped
  s3-init:
    image: pgsty/mc
    environment:
      MINIO_ROOT_USER: startkit
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_S3SECRETKEY}
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: 'sh -c " mc alias set local http://s3:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing local/docs-media-storage && mc version enable local/docs-media-storage
      && mc mb --ignore-existing local/docs-yhub-storage && mc version enable local/docs-yhub-storage && mc mb --ignore-existing local/meet-recordings && mc mb --ignore-existing local/messages-storage &&
      mc mb --ignore-existing local/projects-storage && mc mb --ignore-existing local/drive-media-storage && mc version enable local/drive-media-storage && mc mb --ignore-existing local/grist-docs && mc
      version enable local/grist-docs && mc mb --ignore-existing local/transfers-storage && mc mb --ignore-existing local/conversations-storage && exit 0;"

      '
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command:
    - start
    - --import-realm
    - --health-enabled=true
    environment:
      KC_DB_PASSWORD: ${SERVICE_PASSWORD_64_DBPASSWORDKEYCLOAK}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_KEYCLOAKADMINPASSWORD}
      KC_HOSTNAME: https://auth.${DOMAIN:-web.niyiexpertise.com}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      JAVA_OPTS_APPEND: -Xms256m -Xmx768m
    volumes:
    - startkit-keycloak-import:/opt/keycloak/data/import:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf ''GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3 && grep -q UP <&3'
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
  projects-app:
    image: lasuite/projects:1.27.13
    volumes:
    - projects-user-avatars:/app/public/user-avatars
    - projects-background-images:/app/public/project-background-images
    - projects-attachments:/app/private/attachments
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mail:
        condition: service_started
    restart: unless-stopped
    environment:
      BASE_URL: https://projects.${DOMAIN:-web.niyiexpertise.com}
      DATABASE_URL: postgresql://projects:${SERVICE_PASSWORD_64_DBPASSWORDPROJECTS}@postgres:5432/projects
      SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEYPROJECTS}
      TRUST_PROXY: 'true'
      TZ: UTC
      OIDC_ISSUER: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit
      OIDC_CLIENT_ID: projects
      OIDC_CLIENT_SECRET: ${SERVICE_PASSWORD_64_CLIENTSECRETPROJECTS}
      OIDC_ENFORCED: 'true'
      OIDC_SCOPES: openid email profile
      OIDC_USE_DEFAULT_RESPONSE_MODE: 'true'
      OIDC_CLAIMS_SOURCE: userinfo
      OIDC_EMAIL_ATTRIBUTE: email
      OIDC_FULLNAME_ATTRIBUTES: given_name,family_name
      OIDC_IGNORE_USERNAME: 'true'
      OIDC_IGNORE_ROLES: 'true'
      ALLOW_ALL_TO_CREATE_PROJECTS: 'true'
      DEFAULT_LANGUAGE: fr-FR
      DISABLE_INDEXING: 'true'
      DEFAULT_ADMIN_EMAIL: user1@startkit.${DOMAIN:-web.niyiexpertise.com}
      DEFAULT_ADMIN_NAME: Camille Martin
      SMTP_HOST: mail
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_FROM: '"Projets" <projets@startkit.${DOMAIN:-web.niyiexpertise.com}>'
  meet-migrate:
    image: lasuite/meet-backend:v1.37.0
    configs:
    - source: meet-settings-http
      target: /app/meet/settings_http.py
    command:
    - sh
    - -c
    - 'python manage.py migrate --noinput && python manage.py createsuperuser --email admin@startkit.localhost --password admin

      '
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'
    environment:
      DJANGO_SETTINGS_MODULE: meet.settings_http
      DJANGO_CONFIGURATION: Http
      DJANGO_SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEYMEET}
      DJANGO_ALLOWED_HOSTS: visio.${DOMAIN:-web.niyiexpertise.com},meet-backend,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://visio.${DOMAIN:-web.niyiexpertise.com}
      DJANGO_CORS_ALLOWED_ORIGINS: https://visio.${DOMAIN:-web.niyiexpertise.com}
      DJANGO_SILENCED_SYSTEM_CHECKS: security.W004,security.W008,security.W012,security.W016
      PYTHONPATH: /app
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: meet
      DB_USER: meet
      DB_PASSWORD: ${SERVICE_PASSWORD_64_DBPASSWORDMEET}
      REDIS_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_ENABLED: 'False'
      STORAGES_STATICFILES_BACKEND: whitenoise.storage.CompressedManifestStaticFilesStorage
      AWS_S3_ENDPOINT_URL: http://s3:9000
      AWS_S3_ACCESS_KEY_ID: startkit
      AWS_S3_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_64_S3SECRETKEY}
      AWS_S3_REGION_NAME: us-east-1
      AWS_STORAGE_BUCKET_NAME: meet-recordings
      FILE_UPLOAD_ENABLED: 'False'
      APPLICATION_BASE_URL: https://visio.${DOMAIN:-web.niyiexpertise.com}
      DJANGO_EMAIL_HOST: mail
      DJANGO_EMAIL_PORT: '1025'
      DJANGO_EMAIL_USE_TLS: 'False'
      DJANGO_EMAIL_USE_SSL: 'False'
      DJANGO_EMAIL_FROM: visio@startkit.${DOMAIN:-web.niyiexpertise.com}
      DJANGO_EMAIL_BRAND_NAME: StartKit
      DJANGO_EMAIL_SUPPORT_EMAIL: support@startkit.${DOMAIN:-web.niyiexpertise.com}
      DJANGO_EMAIL_LOGO_IMG: https://visio.${DOMAIN:-web.niyiexpertise.com}/assets/logo-suite-numerique.png
      DJANGO_EMAIL_DOMAIN: visio.${DOMAIN:-web.niyiexpertise.com}
      DJANGO_EMAIL_APP_BASE_URL: https://visio.${DOMAIN:-web.niyiexpertise.com}
      OIDC_OP_JWKS_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/certs
      OIDC_OP_AUTHORIZATION_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/auth
      OIDC_OP_TOKEN_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/token
      OIDC_OP_USER_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/userinfo
      OIDC_OP_LOGOUT_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/logout
      OIDC_OP_URL: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit
      OIDC_RP_CLIENT_ID: meet
      OIDC_RP_CLIENT_SECRET: ${SERVICE_PASSWORD_64_CLIENTSECRETMEET}
      OIDC_RP_SIGN_ALGO: RS256
      OIDC_RP_SCOPES: openid email profile
      OIDC_USERINFO_FULLNAME_FIELDS: given_name,family_name
      OIDC_USERINFO_SHORTNAME_FIELD: given_name
      OIDC_REDIRECT_ALLOWED_HOSTS: visio.${DOMAIN:-web.niyiexpertise.com}
      OIDC_REDIRECT_REQUIRE_HTTPS: 'False'
      LOGIN_REDIRECT_URL: https://visio.${DOMAIN:-web.niyiexpertise.com}
      LOGIN_REDIRECT_URL_FAILURE: https://visio.${DOMAIN:-web.niyiexpertise.com}
      LOGOUT_REDIRECT_URL: https://visio.${DOMAIN:-web.niyiexpertise.com}
      LIVEKIT_API_KEY: ${SERVICE_USER_LIVEKIT}
      LIVEKIT_API_SECRET: ${SERVICE_PASSWORD_64_LIVEKITAPISECRET}
      LIVEKIT_API_URL: https://livekit.${DOMAIN:-web.niyiexpertise.com}
      LIVEKIT_VERIFY_SSL: 'False'
      LIVEKIT_FORCE_WSS_PROTOCOL: 'False'
      ALLOW_UNREGISTERED_ROOMS: 'False'
      RECORDING_ENABLE: 'False'
      RECORDING_DOWNLOAD_BASE_URL: https://visio.${DOMAIN:-web.niyiexpertise.com}/recording
      ROOM_SUBTITLE_ENABLED: 'False'
      METADATA_COLLECTOR_ENABLED: 'False'
      ROOM_TELEPHONY_ENABLED: 'False'
      EXTERNAL_API_ENABLED: 'False'
      ADDONS_ENABLED: 'False'
      CONNECTION_TEST_ENABLED: 'False'
      FRONTEND_USE_FRENCH_GOV_FOOTER: 'False'
      FRONTEND_USE_PROCONNECT_BUTTON: 'False'
      FRONTEND_SILENCE_LIVEKIT_DEBUG: 'True'
  meet-backend:
    image: lasuite/meet-backend:v1.37.0
    configs:
    - source: meet-settings-http
      target: /app/meet/settings_http.py
    command:
    - gunicorn
    - -c
    - /usr/local/etc/gunicorn/meet.py
    - --workers=2
    - meet.wsgi:application
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/__lbheartbeat__', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      meet-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meet-livekit:
        condition: service_started
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: meet.settings_http
      DJANGO_CONFIGURATION: Http
      DJANGO_SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEYMEET}
      DJANGO_ALLOWED_HOSTS: visio.${DOMAIN:-web.niyiexpertise.com},meet-backend,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://visio.${DOMAIN:-web.niyiexpertise.com}
      DJANGO_CORS_ALLOWED_ORIGINS: https://visio.${DOMAIN:-web.niyiexpertise.com}
      DJANGO_SILENCED_SYSTEM_CHECKS: security.W004,security.W008,security.W012,security.W016
      PYTHONPATH: /app
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: meet
      DB_USER: meet
      DB_PASSWORD: ${SERVICE_PASSWORD_64_DBPASSWORDMEET}
      REDIS_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_ENABLED: 'False'
      STORAGES_STATICFILES_BACKEND: whitenoise.storage.CompressedManifestStaticFilesStorage
      AWS_S3_ENDPOINT_URL: http://s3:9000
      AWS_S3_ACCESS_KEY_ID: startkit
      AWS_S3_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_64_S3SECRETKEY}
      AWS_S3_REGION_NAME: us-east-1
      AWS_STORAGE_BUCKET_NAME: meet-recordings
      FILE_UPLOAD_ENABLED: 'False'
      APPLICATION_BASE_URL: https://visio.${DOMAIN:-web.niyiexpertise.com}
      DJANGO_EMAIL_HOST: mail
      DJANGO_EMAIL_PORT: '1025'
      DJANGO_EMAIL_USE_TLS: 'False'
      DJANGO_EMAIL_USE_SSL: 'False'
      DJANGO_EMAIL_FROM: visio@startkit.${DOMAIN:-web.niyiexpertise.com}
      DJANGO_EMAIL_BRAND_NAME: StartKit
      DJANGO_EMAIL_SUPPORT_EMAIL: support@startkit.${DOMAIN:-web.niyiexpertise.com}
      DJANGO_EMAIL_LOGO_IMG: https://visio.${DOMAIN:-web.niyiexpertise.com}/assets/logo-suite-numerique.png
      DJANGO_EMAIL_DOMAIN: visio.${DOMAIN:-web.niyiexpertise.com}
      DJANGO_EMAIL_APP_BASE_URL: https://visio.${DOMAIN:-web.niyiexpertise.com}
      OIDC_OP_JWKS_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/certs
      OIDC_OP_AUTHORIZATION_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/auth
      OIDC_OP_TOKEN_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/token
      OIDC_OP_USER_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/userinfo
      OIDC_OP_LOGOUT_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/logout
      OIDC_OP_URL: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit
      OIDC_RP_CLIENT_ID: meet
      OIDC_RP_CLIENT_SECRET: ${SERVICE_PASSWORD_64_CLIENTSECRETMEET}
      OIDC_RP_SIGN_ALGO: RS256
      OIDC_RP_SCOPES: openid email profile
      OIDC_USERINFO_FULLNAME_FIELDS: given_name,family_name
      OIDC_USERINFO_SHORTNAME_FIELD: given_name
      OIDC_REDIRECT_ALLOWED_HOSTS: visio.${DOMAIN:-web.niyiexpertise.com}
      OIDC_REDIRECT_REQUIRE_HTTPS: 'False'
      LOGIN_REDIRECT_URL: https://visio.${DOMAIN:-web.niyiexpertise.com}
      LOGIN_REDIRECT_URL_FAILURE: https://visio.${DOMAIN:-web.niyiexpertise.com}
      LOGOUT_REDIRECT_URL: https://visio.${DOMAIN:-web.niyiexpertise.com}
      LIVEKIT_API_KEY: ${SERVICE_USER_LIVEKIT}
      LIVEKIT_API_SECRET: ${SERVICE_PASSWORD_64_LIVEKITAPISECRET}
      LIVEKIT_API_URL: https://livekit.${DOMAIN:-web.niyiexpertise.com}
      LIVEKIT_VERIFY_SSL: 'False'
      LIVEKIT_FORCE_WSS_PROTOCOL: 'False'
      ALLOW_UNREGISTERED_ROOMS: 'False'
      RECORDING_ENABLE: 'False'
      RECORDING_DOWNLOAD_BASE_URL: https://visio.${DOMAIN:-web.niyiexpertise.com}/recording
      ROOM_SUBTITLE_ENABLED: 'False'
      METADATA_COLLECTOR_ENABLED: 'False'
      ROOM_TELEPHONY_ENABLED: 'False'
      EXTERNAL_API_ENABLED: 'False'
      ADDONS_ENABLED: 'False'
      CONNECTION_TEST_ENABLED: 'False'
      FRONTEND_USE_FRENCH_GOV_FOOTER: 'False'
      FRONTEND_USE_PROCONNECT_BUTTON: 'False'
      FRONTEND_SILENCE_LIVEKIT_DEBUG: 'True'
  meet-frontend:
    image: lasuite/meet-frontend:v1.37.0
    depends_on:
      meet-backend:
        condition: service_healthy
    restart: unless-stopped
  meet-livekit:
    image: livekit/livekit-server:v1.13.10
    command:
    - --config
    - /etc/livekit/livekit.yaml
    volumes:
    - startkit-livekit-config:/etc/livekit:ro
    depends_on:
      redis:
        condition: service_healthy
      config-init:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
    - 7881:7881/tcp
    - 7882:7882/udp
  meet-egress:
    image: livekit/egress:v1.15.0
    profiles:
    - recording
    network_mode: service:meet-livekit
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    configs:
    - source: meet-egress-config
      target: /etc/egress.yaml
    cap_add:
    - SYS_ADMIN
    depends_on:
      meet-livekit:
        condition: service_started
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped
  messages-migrate:
    image: ghcr.io/suitenumerique/messages-backend:0.10.0
    configs:
    - source: messages-settings-http
      target: /app/messages/settings_http.py
    - source: messages-bootstrap
      target: /startkit/messages-bootstrap.py
    command:
    - sh
    - -c
    - 'python manage.py migrate --noinput && python manage.py create_bucket --storage message-imports --expire-days 7 && python manage.py create_bucket --storage message-blobs && python manage.py search_index_create
      && python manage.py createsuperuser --email admin@startkit.localhost --password admin && python manage.py shell < /startkit/messages-bootstrap.py

      '
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      messages-opensearch:
        condition: service_healthy
    restart: 'no'
    environment:
      DJANGO_SETTINGS_MODULE: messages.settings_http
      DJANGO_CONFIGURATION: Http
      DJANGO_SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEYMESSAGES}
      DJANGO_ALLOWED_HOSTS: messages.${DOMAIN:-web.niyiexpertise.com},messages-backend,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://messages.${DOMAIN:-web.niyiexpertise.com}
      INSTANCE_URL: https://messages.${DOMAIN:-web.niyiexpertise.com}
      PYTHONPATH: /app
      GUNICORN_CMD_ARGS: --workers=2
      LOGGING_LEVEL_HANDLERS_CONSOLE: INFO
      LOGGING_LEVEL_LOGGERS_ROOT: INFO
      LOGGING_LEVEL_LOGGERS_APP: INFO
      SALT_KEY: ${SERVICE_PASSWORD_64_SALTKEYMESSAGES}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: messages
      DB_USER: messages
      DB_PASSWORD: ${SERVICE_PASSWORD_64_DBPASSWORDMESSAGES}
      REDIS_URL: redis://redis:6379/4
      CELERY_BROKER_URL: redis://redis:6379/5
      OIDC_OP_JWKS_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/certs
      OIDC_OP_AUTHORIZATION_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/auth
      OIDC_OP_TOKEN_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/token
      OIDC_OP_USER_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/userinfo
      OIDC_OP_LOGOUT_ENDPOINT: https://auth.${DOMAIN:-web.niyiexpertise.com}/realms/startkit/protocol/openid-connect/logout
