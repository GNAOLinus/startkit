# Infrastructure partagée — version déploiement distant (Coolify).
#
# Différences avec stack/infra.yml (version locale) :
#   - Coolify génère les secrets depuis ses variables SERVICE_PASSWORD_* ;
#   - la configuration sensible est rendue au démarrage dans un volume Docker ;
#   - Keycloak tourne en mode `start` (production) et non `start-dev`.
#
# Le port 8000 du proxy est celui que Coolify doit router (voir coolify/README.md).

services:
  # Prépare les fichiers dépendant des secrets avant de démarrer PostgreSQL,
  # Keycloak et LiveKit. Les valeurs sont générées et conservées par Coolify.
  config-init:
    build:
      context: ./coolify
      dockerfile: Dockerfile.config-init
    environment:
      DOMAIN: ${DOMAIN:-web.niyiexpertise.com}
      CLIENT_SECRET_CONVERSATIONS: ${SERVICE_PASSWORD_64_CLIENTSECRETCONVERSATIONS}
      CLIENT_SECRET_DOCS: ${SERVICE_PASSWORD_64_CLIENTSECRETDOCS}
      CLIENT_SECRET_DRIVE: ${SERVICE_PASSWORD_64_CLIENTSECRETDRIVE}
      CLIENT_SECRET_GRIST: ${SERVICE_PASSWORD_64_CLIENTSECRETGRIST}
      CLIENT_SECRET_MEET: ${SERVICE_PASSWORD_64_CLIENTSECRETMEET}
      CLIENT_SECRET_MESSAGES: ${SERVICE_PASSWORD_64_CLIENTSECRETMESSAGES}
      CLIENT_SECRET_PROJECTS: ${SERVICE_PASSWORD_64_CLIENTSECRETPROJECTS}
      CLIENT_SECRET_TRANSFERS: ${SERVICE_PASSWORD_64_CLIENTSECRETTRANSFERS}
      DB_PASSWORD_CONVERSATIONS: ${SERVICE_PASSWORD_64_DBPASSWORDCONVERSATIONS}
      DB_PASSWORD_DOCS: ${SERVICE_PASSWORD_64_DBPASSWORDDOCS}
      DB_PASSWORD_DRIVE: ${SERVICE_PASSWORD_64_DBPASSWORDDRIVE}
      DB_PASSWORD_GRIST: ${SERVICE_PASSWORD_64_DBPASSWORDGRIST}
      DB_PASSWORD_KEYCLOAK: ${SERVICE_PASSWORD_64_DBPASSWORDKEYCLOAK}
      DB_PASSWORD_MEET: ${SERVICE_PASSWORD_64_DBPASSWORDMEET}
      DB_PASSWORD_MESSAGES: ${SERVICE_PASSWORD_64_DBPASSWORDMESSAGES}
      DB_PASSWORD_PROJECTS: ${SERVICE_PASSWORD_64_DBPASSWORDPROJECTS}
      DB_PASSWORD_TRANSFERS: ${SERVICE_PASSWORD_64_DBPASSWORDTRANSFERS}
      DB_PASSWORD_YHUB: ${SERVICE_PASSWORD_64_DBPASSWORDYHUB}
      DEMO_PASSWORD_USER1: ${SERVICE_PASSWORD_64_DEMOPASSWORDUSER1}
      DEMO_PASSWORD_USER2: ${SERVICE_PASSWORD_64_DEMOPASSWORDUSER2}
      DEMO_PASSWORD_USER3: ${SERVICE_PASSWORD_64_DEMOPASSWORDUSER3}
      KEYCLOAK_ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_KEYCLOAKADMINPASSWORD}
      LIVEKIT_API_KEY: ${SERVICE_USER_LIVEKIT}
      LIVEKIT_API_SECRET: ${SERVICE_PASSWORD_64_LIVEKITAPISECRET}
    volumes:
      - startkit-postgres-init:/postgres-init
      - startkit-keycloak-import:/keycloak-import
      - startkit-livekit-config:/livekit-config
    restart: "no"

  # Point d'entrée unique. Caddy route par sous-domaine ; les alias réseau
  # gardent les mêmes URL internes qu'en local (.localhost).
  proxy:
    build:
      context: ./stack
      dockerfile: caddy/Dockerfile.coolify
    expose:
      - "8000"
    environment:
      DOMAIN: ${DOMAIN:-web.niyiexpertise.com}
    networks:
      default:
        aliases:
          - startkit.localhost
          - auth.localhost
          - mail.localhost
          - s3.localhost
          - s3-console.localhost
          - docs.localhost
          - visio.localhost
          - livekit.localhost
          - messages.localhost
          - projects.localhost
          - fichiers.localhost
          - grist.localhost
          - transfers.localhost
          - assistant.localhost
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRESSUPERUSERPASSWORD}
    volumes:
      - startkit-postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    depends_on:
      config-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  s3:
    image: pgsty/silo
    environment:
      MINIO_ROOT_USER: startkit
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_S3SECRETKEY}
    command: server --console-address :9001 /data
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 20s
      retries: 60
    restart: unless-stopped

  # Crée les buckets de toutes les apps puis s'arrête.
  # `$$` est échappé pour que le shell du conteneur lise les variables d'env.
  s3-init:
    image: pgsty/mc
    environment:
      MINIO_ROOT_USER: startkit
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_S3SECRETKEY}
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://s3:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/docs-media-storage &&
      mc version enable local/docs-media-storage &&
      mc mb --ignore-existing local/docs-yhub-storage &&
      mc version enable local/docs-yhub-storage &&
      mc mb --ignore-existing local/meet-recordings &&
      mc mb --ignore-existing local/messages-storage &&
      mc mb --ignore-existing local/projects-storage &&
      mc mb --ignore-existing local/drive-media-storage &&
      mc version enable local/drive-media-storage &&
      mc mb --ignore-existing local/grist-docs &&
      mc version enable local/grist-docs &&
      mc mb --ignore-existing local/transfers-storage &&
      mc mb --ignore-existing local/conversations-storage &&
      exit 0;"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # `start` (et non `start-dev`) : mode production, pas de valeurs par défaut.
    command: ["start", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB_PASSWORD: ${SERVICE_PASSWORD_64_DBPASSWORDKEYCLOAK}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_KEYCLOAKADMINPASSWORD}
      KC_HOSTNAME: https://auth.${DOMAIN:-web.niyiexpertise.com}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: -Xms256m -Xmx768m
    volumes:
      - startkit-keycloak-import:/opt/keycloak/data/import:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  # Boîte de réception de test (mailpit). En production, brancher un vrai SMTP :
  # voir coolify/README.md.
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped

volumes:
  startkit-postgres-init:
  startkit-keycloak-import:
  startkit-livekit-config:
  postgres-data:
  s3-data:
