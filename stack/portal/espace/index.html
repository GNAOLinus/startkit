<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon espace — StartKit</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
  /* Thème clair imposé, quel que soit le réglage du navigateur. */
  :root { color-scheme: light; }
  :root {
    --bg: #f6f6f8; --surface: #ffffff; --border: #e3e3ea; --text: #161616; --muted: #5c5c6e;
    --accent: #3d47e6; --accent-soft: #e6e8ff; --up: #18753c; --down: #ce0500; --wait: #b34000;
    --logo-base: #1b1b6b;
    --code-bg: #f0f0f4; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
    * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Marianne", sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .logo { width: 52px; height: 52px; flex: none; }
  .logo-base { fill: var(--logo-base); }
  h1 { font-size: 28px; margin: 0; letter-spacing: -.02em; line-height: 1.1; }
  .tagline { color: var(--muted); font-size: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 36px 0 12px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; display: flex; flex-direction: column; gap: 10px; text-decoration: none;
    box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
  a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card-top { display: flex; align-items: center; gap: 12px; }
  .icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); flex: none; }
  .icon svg { width: 22px; height: 22px; }
  .name { font-weight: 650; font-size: 16px; }
  .host { font-size: 12.5px; color: var(--muted); font-family: ui-monospace, monospace; word-break: break-all; }
  .desc { color: var(--muted); font-size: 14px; margin: 0; flex: 1; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); }
  .status[data-state="up"] .dot { background: var(--up); }
  .status[data-state="down"] .dot { background: var(--down); }
  .tools .card { padding: 14px 16px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="8" y="27" width="14" height="13" rx="3.5" fill="#4f5bff"/>
      <rect x="25" y="13" width="14" height="27" rx="3.5" fill="#22a699"/>
      <rect x="42" y="31" width="14" height="9" rx="3.5" fill="#ff6b57"/>
      <rect class="logo-base" x="5" y="44" width="54" height="10" rx="4"/>
    </svg>
    <div>
      <h1>StartKit</h1>
      <div class="tagline">Espace applications · <a href="/">retour à l’accueil</a></div>
    </div>
  </header>
  <h2>Applications</h2>
  <div class="grid" id="apps"></div>

  <h2>Outils</h2>
  <div class="grid tools" id="tools"></div>

</div>

<script>
  const icons = {
    docs: '<path d="M7 3h7l5 5v13H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5M10 13h6M10 17h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    visio: '<rect x="3" y="6" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 10.5 21 8v8l-5-2.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    messages: '<rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    projects: '<rect x="3" y="4" width="5" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="10" y="4" width="5" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="17" y="4" width="4" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>',
    fichiers: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    grist: '<rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M3 14.5h18M9 4v16M15 4v16" stroke="currentColor" stroke-width="1.6"/>',
    transfers: '<path d="M12 3v12M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    assistant: '<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" fill="currentColor"/>',
    tchap: '<path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 10h8M8 13h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    auth: '<rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/>',
    mail: '<path d="M4 13h4l2 3h4l2-3h4M4 13l2-7h12l2 7v6H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    s3: '<ellipse cx="12" cy="6" rx="7" ry="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" fill="none" stroke="currentColor" stroke-width="1.8"/>'
  };

  // `check` : URL interrogée pour savoir si le service répond.
  // Les apps derrière le proxy passent par /status/<id> (même origine : on lit le vrai code HTTP).
  // Tchap tourne hors du proxy : on vérifie seulement que le port répond.
  const apps = [
    { id: 'docs', name: 'Docs', url: 'http://docs.localhost:8000', desc: 'Éditeur collaboratif en temps réel, sous-pages et exports.', check: '/status/docs' },
    { id: 'assistant', name: 'Assistant IA', url: 'http://assistant.localhost:8000', desc: 'Assistant conversationnel sur un modèle d’IA local : rien ne sort de la machine.', check: '/status/assistant' },
    { id: 'visio', name: 'Visio', url: 'http://visio.localhost:8000', desc: 'Visioconférence LiveKit, partage d’écran et chat.', check: '/status/visio' },
    { id: 'fichiers', name: 'Fichiers', url: 'http://fichiers.localhost:8000', desc: 'Stockage et partage de fichiers avec les bonnes personnes.', check: '/status/fichiers' },
    { id: 'grist', name: 'Grist', url: 'http://grist.localhost:8000', desc: 'Tableur collaboratif pour structurer tes bases de données.', check: '/status/grist' },
    { id: 'transfers', name: 'Transfers', url: 'http://transfers.localhost:8000', desc: 'Envoi de fichiers volumineux par lien ou par e-mail.', check: '/status/transfers' },
    { id: 'messages', name: 'Messages', url: 'http://messages.localhost:8000', desc: 'Boîte mail collaborative, boîtes personnelles et partagées.', check: '/status/messages' },
    { id: 'projects', name: 'Projets', url: 'http://projects.localhost:8000', desc: 'Tableaux kanban pour suivre les projets d’équipe.', check: '/status/projects' },
    { id: 'tchap', name: 'Tchap', url: 'http://localhost:8088', desc: 'Messagerie instantanée Matrix (ta stack Tchap locale).', check: 'http://localhost:8088', opaque: true },
  ];
  const tools = [
    { id: 'auth', name: 'Keycloak', url: 'http://auth.localhost:8000/admin/master/console/#/startkit', desc: 'Comptes et connexion unique (royaume « startkit »).', check: '/status/auth' },
    { id: 'mail', name: 'Mailpit', url: 'http://mail.localhost:8000', desc: 'Tous les e-mails envoyés par les applications.', check: '/status/mail' },
    { id: 's3', name: 'Console S3', url: 'http://s3-console.localhost:8000', desc: 'Fichiers stockés par Docs, Visio et Messages.', check: '/status/s3-console' },
  ];

  function render(list, el) {
    for (const a of list) {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = a.url;
      card.innerHTML = `
        <div class="card-top">
          <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24">${icons[a.id]}</svg></div>
          <div><div class="name"></div><div class="host"></div></div>
        </div>
        <p class="desc"></p>
        <span class="status" data-state="wait"><span class="dot"></span><span class="label">Vérification…</span></span>`;
      card.querySelector('.name').textContent = a.name;
      card.querySelector('.host').textContent = a.url.replace('http://', '').split('/')[0];
      card.querySelector('.desc').textContent = a.desc;
      el.appendChild(card);
      a.statusEl = card.querySelector('.status');
    }
  }

  async function probe(a) {
    let up = false;
    try {
      if (a.opaque) {
        await fetch(a.check, { mode: 'no-cors', cache: 'no-store' });
        up = true;
      } else {
        const r = await fetch(a.check, { redirect: 'manual', cache: 'no-store' });
        up = r.type === 'opaqueredirect' || r.status < 500;
      }
    } catch (e) { up = false; }
    a.statusEl.dataset.state = up ? 'up' : 'down';
    a.statusEl.querySelector('.label').textContent = up ? 'En ligne' : 'Hors ligne ou en démarrage';
  }

  render(apps, document.getElementById('apps'));
  render(tools, document.getElementById('tools'));
  const all = [...apps, ...tools];
  const refresh = () => all.forEach(probe);
  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
