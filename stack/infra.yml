# Infrastructure partagée par toutes les applications de la stack.
# Chaque application a sa propre base, son préfixe Redis et ses buckets S3,
# mais un seul exemplaire de chaque service tourne.

services:
  # Point d'entrée unique, sur http://*.localhost:8000.
  # Les alias réseau font que les conteneurs joignent auth.localhost:8000 (etc.)
  # exactement comme le navigateur : mêmes URL dedans et dehors.
  proxy:
    image: caddy:2.10-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/apps:/etc/caddy/apps:ro
      - ./portal:/srv/portal:ro
    networks:
      default:
        aliases:
          - startkit.localhost
          - auth.localhost
          - mail.localhost
          - s3.localhost
          - s3-console.localhost
          - docs.localhost
          - visio.localhost
          - livekit.localhost
          - messages.localhost
          - projects.localhost
          - fichiers.localhost
          - grist.localhost
          - transfers.localhost
          - assistant.localhost
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  s3:
    image: pgsty/silo
    environment:
      MINIO_ROOT_USER: startkit
      MINIO_ROOT_PASSWORD: startkit-secret
    command: server --console-address :9001 /data
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 20s
      retries: 60
    restart: unless-stopped

  # Crée les buckets de toutes les apps puis s'arrête.
  # Les lignes finissent par `&&` (pas par `\`) : yaml les replie avec un espace.
  s3-init:
    image: pgsty/mc
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://s3:9000 startkit startkit-secret &&
      mc mb --ignore-existing local/docs-media-storage &&
      mc version enable local/docs-media-storage &&
      mc mb --ignore-existing local/docs-yhub-storage &&
      mc version enable local/docs-yhub-storage &&
      mc mb --ignore-existing local/meet-recordings &&
      mc mb --ignore-existing local/messages-storage &&
      mc mb --ignore-existing local/projects-storage &&
      mc mb --ignore-existing local/drive-media-storage &&
      mc version enable local/drive-media-storage &&
      mc mb --ignore-existing local/grist-docs &&
      mc version enable local/grist-docs &&
      mc mb --ignore-existing local/transfers-storage &&
      mc mb --ignore-existing local/conversations-storage &&
      exit 0;"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://auth.localhost:8000
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: -Xms256m -Xmx768m
    volumes:
      - ./keycloak/startkit-realm.json:/opt/keycloak/data/import/startkit-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  # Capture tous les e-mails envoyés (SMTP mail:1025), lisibles sur mail.localhost:8000.
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
